<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mermaid Plus — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/* "This was right in March." — an advertisement in three acts.
   Act one is a wiki page: flat, light, dead. Act two is the turn. Act three is
   the product, and the film gets its colour back when it arrives. */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --accent: #38cfe0;
}
/* Act one: somebody's wiki, printed out. */
.deck[data-act="wiki"] {
  --ground: #e9e9e6; --panel: #f5f5f3; --ink: #1c1e22; --muted: #5c6068;
  --faint: #8b9099; --line: #d3d4d0; --accent: #1c1e22;
}
/* Act two and three: the product. */
.deck[data-act="turn"], .deck[data-act="alive"] {
  --ground: #06080d; --panel: #090c14; --ink: #eef1f7; --muted: #98a1b7;
  --faint: #5f6880; --line: #1a2130; --accent: #38cfe0;
}

html, body { height: 100%; }
body { margin: 0; background: #000; font-family: var(--sans); overflow: hidden; }
.fit { position: absolute; overflow: hidden; }

.deck {
  position: absolute; inset: 0; display: grid;
  background: var(--ground); color: var(--ink);
  transition: background 1.1s ease, color 1.1s ease,
    grid-template-columns .7s cubic-bezier(.4,0,.2,1), grid-template-rows .7s cubic-bezier(.4,0,.2,1);
}

/* ── The picture ────────────────────────────────────────────────────────── */
.panel {
  position: relative; overflow: hidden; min-width: 0; min-height: 0;
  background: var(--panel); border: 1px solid var(--line);
  transition: background 1.1s ease, border-color 1.1s ease, opacity .6s ease;
}
.deck[data-layout="card"] .panel, .deck[data-layout="end"] .panel { border-color: transparent; }
.deck[data-layout="end"] .panel { opacity: 0; }

#camera {
  position: absolute; inset: 0;
  transform: scale(var(--s, 1)) translate(var(--x, 0%), var(--y, 0%));
  transition: transform var(--cam-ms, 4000ms) cubic-bezier(.33, 0, .2, 1);
  will-change: transform;
}
/* A block, not a centred grid item: `place-items: center` stops the item being
   stretched, so height:100% resolved to auto and the picture grew past the
   bottom of the panel. The image is positioned to the box and letterboxes
   itself. */
.sheet { position: absolute; inset: 6%; opacity: 0; transition: opacity .8s ease; }
/* Clear of the corner stamp, which is part of the picture's story and should
   not be sitting on top of a box in it. */
.deck[data-act="wiki"] .sheet { inset: 5% 5% 13% 5%; }
.sheet.in { opacity: 1; }
.sheet.out { opacity: 0; }
.sheet svg { width: 100%; height: 100%; display: block; }
/* The wiki picture is a raster on purpose. max-width does not scale a small
   image up, so it sat tiny in the middle of the frame; it fills the frame and
   goes soft doing it, which is the point being made. */
.sheet img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

.glow {
  position: absolute; inset: -25%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  transition: opacity 1.2s ease; animation: drift 26s ease-in-out infinite alternate;
}
.deck[data-act="alive"] .glow { opacity: .6; }
@keyframes drift { from { transform: translate(-7%, -5%) scale(1); } to { transform: translate(8%, 6%) scale(1.2); } }
.vignette {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 46%, #000 120%);
  transition: opacity 1.2s ease;
}
.deck[data-act="alive"] .vignette, .deck[data-act="turn"] .vignette { opacity: .68; }
.scrim { position: absolute; inset: 0; pointer-events: none; background: var(--ground); opacity: 0; transition: opacity .7s ease; }
.scrim.on { opacity: var(--dim, .74); }

/* The corner stamp: the detail that makes it somebody's actual wiki. */
.stamp {
  position: absolute; right: 0; bottom: 0; opacity: 0;
  font-family: var(--mono); color: var(--faint);
  border-top: 1px solid var(--line); border-left: 1px solid var(--line);
  background: var(--panel); transition: opacity .6s ease;
}
.deck[data-act="wiki"] .stamp { opacity: 1; }

/* ── The diagram inking itself in ───────────────────────────────────────── */
.sheet.draw .mp-edge-path { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: ink 1.2s cubic-bezier(.4,0,.2,1) .35s forwards; }
@keyframes ink { to { stroke-dashoffset: 0; } }
.sheet.draw .mp-diagram .mp-node { opacity: 0; animation: pop .55s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.sheet.draw .mp-diagram .mp-nodes .mp-node:nth-child(1) { animation-delay: .1s }
.sheet.draw .mp-diagram .mp-nodes .mp-node:nth-child(2) { animation-delay: .22s }
.sheet.draw .mp-diagram .mp-nodes .mp-node:nth-child(3) { animation-delay: .34s }
.sheet.draw .mp-diagram .mp-nodes .mp-node:nth-child(4) { animation-delay: .46s }
.sheet.draw .mp-diagram .mp-nodes .mp-node:nth-child(5) { animation-delay: .58s }
.sheet.draw .mp-diagram .mp-nodes .mp-node:nth-child(n+6) { animation-delay: .7s }

/* ── Copy ───────────────────────────────────────────────────────────────── */
.copy { display: flex; flex-direction: column; min-width: 0; min-height: 0; justify-content: flex-start; }
.deck[data-layout="card"] .copy { z-index: 3; align-items: center; justify-content: center; text-align: center; }
.deck[data-layout="end"] .copy { opacity: 0; }
.line { display: block; overflow: hidden; }
.line > span {
  display: block; font-family: var(--mono); font-weight: 600; letter-spacing: -.04em;
  transform: translateY(112%); opacity: 0; animation: land .8s cubic-bezier(.16,1,.3,1) forwards;
}
.line.out > span { animation: leave .4s cubic-bezier(.6,0,.8,.2) forwards; }
@keyframes land { to { transform: none; opacity: 1; } }
@keyframes leave { to { transform: translateY(-104%); opacity: 0; } }
.line em { font-style: normal; color: var(--accent); }
.sub { font-family: var(--sans); font-weight: 400; color: var(--muted); opacity: 0; animation: fade .7s ease .35s forwards; }
@keyframes fade { to { opacity: 1; } }

/* ── The source, and the two edits that fix it ──────────────────────────── */
#card {
  position: absolute; inset: 0; display: grid; place-content: center start;
  opacity: 0; transition: opacity .7s ease; pointer-events: none;
}
#card.on { opacity: 1; }
#code { margin: 0; font-family: var(--mono); color: var(--muted); }
#code .cl { display: block; transition: opacity .5s ease, max-height .55s ease, color .4s ease; max-height: 3em; }
#code .cl b { color: var(--ink); font-weight: 400; }
#code .cl.cut { color: #ff6b6b; text-decoration: line-through; text-decoration-thickness: 2px; }
#code .cl.gone { opacity: 0; max-height: 0; }
#code .ed { color: var(--accent); }

/* ── Callout ────────────────────────────────────────────────────────────── */
#callout {
  position: absolute; display: flex; align-items: center; gap: 10px; z-index: 4;
  opacity: 0; transform: translateY(8px);
  transition: opacity .5s ease, transform .55s cubic-bezier(.2,.9,.3,1); pointer-events: none;
}
#callout.on { opacity: 1; transform: none; }
#callout .dot { width: 9px; height: 9px; border-radius: 50%; background: #d64545; flex: none; box-shadow: 0 0 0 5px #d6454533; }
#callout .rule { height: 1px; background: #d64545; opacity: .6; }
#callout .text { font-family: var(--mono); color: #b23b3b; white-space: nowrap; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }

/* ── Brand and end ──────────────────────────────────────────────────────── */
.mark { display: flex; align-items: baseline; gap: 9px; opacity: 0; transition: opacity .9s ease; }
.deck[data-act="alive"] .mark { opacity: .55; }
.mark b { font-family: var(--mono); font-weight: 600; letter-spacing: -.025em; color: var(--ink); }
.mark b i { font-style: normal; color: var(--accent); }
.mark span { font-family: var(--mono); color: var(--faint); }
.deck[data-layout="end"] .mark { opacity: 0; }

.end {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
  gap: 16px; text-align: center; opacity: 0; pointer-events: none; z-index: 5;
  background: var(--ground); transition: opacity .8s ease;
}
.deck[data-layout="end"] .end { opacity: 1; }
.end .word { font-family: var(--mono); font-weight: 600; letter-spacing: -.045em; color: var(--ink); }
.end .word i { font-style: normal; color: var(--accent); }
.end p { margin: 0; color: var(--muted); }
.end .fine { font-family: var(--mono); color: var(--faint); }

@media (prefers-reduced-motion: reduce) {
  .glow, .line > span, .sub { animation: none !important; }
  .line > span { transform: none; opacity: 1; }
  .sub { opacity: 1; }
  #camera, .sheet, #card, #callout, .deck { transition: none !important; }
  .sheet.draw .mp-edge-path, .sheet.draw .mp-diagram .mp-node { animation: none !important; stroke-dashoffset: 0; opacity: 1; }
}
.fit { width: 1920px; height: 1080px; }

.deck { padding: 56px 76px 68px; gap: 46px 64px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) 250px; }
.mark { grid-column: 1 / -1; grid-row: 1; }
.panel { grid-row: 2; grid-column: 1 / -1; border-radius: 14px; align-self: center; height: min(100%, 660px); }
.copy { grid-row: 3; grid-column: 1 / -1; }
.deck[data-layout="card"] .copy, .deck[data-layout="end"] .copy { grid-row: 2 / 4; }

.mark b { font-size: 19px; }
.mark span { font-size: 13px; }

.line > span { font-size: 80px; line-height: 1.04; }
.deck[data-layout="card"] .line > span { font-size: 104px; }
.sub { margin: 20px 0 0; font-size: 23px; line-height: 1.45; max-width: 72ch; }
.deck[data-layout="card"] .sub { font-size: 28px; max-width: 48ch; }

#card { padding-left: 76px; }
#code { font-size: 27px; line-height: 2.05; }
.stamp { font-size: 14px; padding: 10px 16px; }
#callout .text { font-size: 15px; padding: 8px 13px; }

.end .word { font-size: 108px; }
.end p { font-size: 30px; }
.end .fine { font-size: 18px; margin-top: 8px; }
</style>
</head>
<body>
<div class="fit" id="fit">
  <div class="deck" id="deck" data-act="wiki" data-layout="stage">

    <div class="mark"><b>Mermaid<i>Plus</i></b><span>the same files, drawn properly</span></div>

    <section class="panel" id="panel">
      <div class="glow"></div>
      <div id="camera"></div>
      <div class="vignette"></div>
      <div class="scrim" id="scrim"></div>
      <div id="card"><pre id="code"></pre></div>
      <div id="callout"><span class="dot"></span><span class="rule"></span><span class="text"></span></div>
      <div class="stamp">architecture.png &middot; last edited 18 March</div>
    </section>

    <section class="copy">
      <div class="type-layer" id="type-layer"></div>
    </section>

    <div class="end">
      <div class="word">Mermaid<i>Plus</i></div>
      <p>Write Mermaid. Get a diagram worth showing.</p>
      <div class="fine">Runs entirely in your browser. Nothing is uploaded.</div>
    </div>

  </div>
</div>

<script>
// The deck is composed at one size so a recording is framed exactly. Landscape
// fits inside the window; vertical covers it, because a phone taller than 9:16
// would otherwise show the film in a letterbox with black above and below.
const FILL = false;
const fit = document.getElementById('fit');
function scale() {
  const w = fit.offsetWidth, h = fit.offsetHeight;
  const sx = innerWidth / w, sy = innerHeight / h;
  const k = FILL ? Math.max(sx, sy) : Math.min(sx, sy);
  fit.style.transform = `scale(${k})`;
  fit.style.transformOrigin = 'top left';
  fit.style.left = `${(innerWidth - w * k) / 2}px`;
  fit.style.top = `${(innerHeight - h * k) / 2}px`;
}
addEventListener('resize', scale);
scale();
</script>
<script>const SVG = JSON.parse(document.getElementById('scene-svg').textContent);
const STEPS = JSON.parse(document.getElementById('scene-steps').textContent);

const deck = document.getElementById('deck');
const camera = document.getElementById('camera');
const scrim = document.getElementById('scrim');
const typeLayer = document.getElementById('type-layer');
const card = document.getElementById('card');
const code = document.getElementById('code');
const callout = document.getElementById('callout');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** The wiki picture is a raster; everything after the turn is vector. */
let showing = null;
function setPicture(step) {
  const name = step.pic ?? null;
  if (name === showing) return;
  showing = name;
  const sheet = document.createElement('div');
  sheet.className = 'sheet' + (step.draw && !still ? ' draw' : '');
  if (name) {
    sheet.innerHTML = SVG[name].startsWith('data:')
      ? `<img src="${SVG[name]}" alt="">`
      : SVG[name];
  }
  camera.append(sheet);
  requestAnimationFrame(() => sheet.classList.add('in'));
  for (const old of camera.querySelectorAll('.sheet')) {
    if (old === sheet) continue;
    old.classList.add('out');
    setTimeout(() => old.remove(), 900);
  }
}

function setCamera(step, ms) {
  const cam = step.cam ?? { s: 1, x: 0, y: 0 };
  camera.style.setProperty('--cam-ms', `${ms}ms`);
  camera.style.setProperty('--s', cam.s ?? 1);
  camera.style.setProperty('--x', `${cam.x ?? 0}%`);
  camera.style.setProperty('--y', `${cam.y ?? 0}%`);
}

function setType(step) {
  for (const line of [...typeLayer.children]) {
    line.classList.add('out');
    setTimeout(() => line.remove(), 440);
  }
  (step.title ?? []).forEach((text, i) => {
    const line = document.createElement('span');
    line.className = 'line';
    const inner = document.createElement('span');
    inner.innerHTML = text;
    inner.style.animationDelay = `${140 + i * 110}ms`;
    line.append(inner);
    typeLayer.append(line);
  });
  if (step.sub) {
    const p = document.createElement('p');
    p.className = 'sub';
    p.innerHTML = step.sub;
    typeLayer.append(p);
  }
}

/**
 * The source, and the two edits that put it right.
 *
 * This is the turn of the film, so the correction is shown rather than
 * described: one line is struck through and folds away, one word is replaced.
 * Small enough that "anyone can fix a line" is a claim you can watch.
 */
function setCode(step) {
  card.classList.toggle('on', !!step.code);
  if (!step.code) return;
  if (code.dataset.of !== String(step.code.length)) {
    code.textContent = '';
    for (const text of step.code) {
      const line = document.createElement('span');
      line.className = 'cl';
      line.textContent = text || ' ';
      code.append(line);
    }
    code.dataset.of = String(step.code.length);
  }
  if (!step.edits) return;
  const lines = [...code.children];
  for (const edit of step.edits) {
    const line = lines[edit.line];
    if (!line) continue;
    if (edit.cut) {
      setTimeout(() => line.classList.add('cut'), edit.at ?? 700);
      setTimeout(() => line.classList.add('gone'), (edit.at ?? 700) + 900);
    } else if (edit.to) {
      setTimeout(async () => {
        const before = line.textContent.split(edit.from)[0];
        for (let i = 0; i <= edit.to.length; i++) {
          line.innerHTML = before + '<span class="ed">' + edit.to.slice(0, i) + '</span>';
          await sleep(still ? 0 : 55);
        }
      }, edit.at ?? 1800);
    }
  }
}

function setCallout(step) {
  callout.classList.remove('on');
  if (!step.callout) return;
  const { x, y, text, width } = step.callout;
  callout.style.left = `${x}%`;
  callout.style.top = `${y}%`;
  callout.querySelector('.rule').style.width = `${width ?? 60}px`;
  callout.querySelector('.text').textContent = text;
  setTimeout(() => callout.classList.add('on'), Math.max(300, step.ms * 0.5));
}

async function play() {
  for (;;) {
    showing = null;
    code.dataset.of = '';
    for (const step of STEPS) {
      deck.dataset.act = step.act ?? 'alive';
      deck.dataset.layout = step.close ? 'end' : step.dim ? 'card' : step.code ? 'text' : step.cam ? 'focus' : 'stage';
      scrim.classList.toggle('on', !!step.dim);
      if (step.dim) scrim.style.setProperty('--dim', step.dim);
      setPicture(step);
      setCamera(step, step.ms);
      setType(step);
      setCode(step);
      setCallout(step);
      await sleep(step.ms);
    }
    await sleep(600);
  }
}
play();
</script>
